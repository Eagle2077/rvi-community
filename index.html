<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Сообщество РВИ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header (brand, global search, tabs); each tab owns its body. Chats = channel list + message pane. */
:root{
  /* Фирменный стиль РВИ: графитовый фон в тонкую сетку, кислотный салатовый, широкий тонкий гротеск, «// РВИ». */
  --bg:#252525; --surface:#2C2C2C; --surface-2:#343434; --line:#414141; --grid:rgba(255,255,255,.04);
  --ink:#EDEDED; --muted:#A2A2A2; --accent:#D4FF3B; --accent-ink:#252525; --accent-soft:#3A421F;
  --admin:#F2B45A; --admin-soft:#4A3A22;
  --yes:#5FD48F; --yes-soft:#22413A; --no:#FF7A6E; --no-soft:#4A2C30; --abst:#808080;
  --bubble:#343434; --bubble-me:#3A421F;
  --display:"Unbounded","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px; color-scheme:dark;
}
a{color:var(--accent)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
mark{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:none;margin:0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:12px 16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;border-radius:50%;background:var(--accent-ink);border:6px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:9px;font-weight:700;flex:none}
.brand h1{font-size:17px}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--body);font-weight:400}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 16px 9px 38px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who img{width:28px;height:28px;border-radius:50%}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 13px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center;font-size:14px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.count{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}

.page{padding-block:20px 48px}
.layout{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(320px,1fr);gap:20px}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.sec-title{font-size:20px;margin-bottom:2px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--no)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sel-yes{background:var(--yes-soft);border-color:var(--yes);color:var(--yes)}
.btn.sel-no{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.btn.sel-abst{background:var(--surface-2);border-color:var(--abst)}

label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:5px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 11px;font-weight:400}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
button.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.tag{background:transparent;color:var(--accent);border-color:var(--accent-soft)}
.chip.tag[data-facet="tool"]{font-family:var(--mono);color:#9AD8FF;border-color:#2F4A5C}
.chip.tag[data-facet="platform"]{color:#C9B6FF;border-color:#433A5E}
.chip.tag[data-facet="topic"]{color:var(--admin);border-color:var(--admin-soft)}
.facet-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.chip.admin{background:var(--admin-soft);color:var(--admin);border-color:transparent}
.chip.law{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.yes{background:var(--yes-soft);color:var(--yes);border-color:transparent}
.chip.no{background:var(--no-soft);color:var(--no);border-color:transparent}
.chip.live{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip.lvl-expert{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip.lvl-pro{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tags{display:flex;gap:6px;flex-wrap:wrap}

.avatar{width:36px;height:36px;border-radius:50%;flex:none;background:var(--surface-2);object-fit:cover}
.avatar.sm{width:28px;height:28px}
.avatar.lg{width:64px;height:64px}
.post-head{display:flex;gap:10px;align-items:center}
.name{font-weight:600}
.body-text{white-space:pre-wrap;word-wrap:break-word;max-width:70ch}
.actions{display:flex;gap:4px;flex-wrap:wrap;margin-left:-8px}
.comments{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:10px}
.comment{display:flex;gap:8px}
.comment p{margin:2px 0 0;white-space:pre-wrap;word-wrap:break-word}

/* chats */
.chat{display:grid;grid-template-columns:240px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);height:calc(100dvh - 210px);min-height:440px}
@media (max-width:760px){.chat{grid-template-columns:1fr;height:auto}.chat .chlist{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.chat .chlist .ch-desc,.chat .chlist .eyebrow{display:none}.msgs{max-height:60vh}}
.chlist{display:flex;flex-direction:column;gap:2px;padding:10px;border-right:1px solid var(--line);overflow-y:auto;background:var(--surface-2)}
.ch{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.ch b{font-weight:600;font-size:14px;white-space:nowrap}
.ch .ch-desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch[aria-current="true"]{background:var(--accent-soft)}
.ch[aria-current="true"] b{color:var(--accent)}
.chpane{display:flex;flex-direction:column;min-width:0;min-height:0}
.chhead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msgs{flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:min(640px,92%)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{background:var(--bubble);border-radius:14px 14px 14px 4px;padding:8px 12px;min-width:0}
.msg.me .bubble{background:var(--bubble-me);border-radius:14px 14px 4px 14px}
.bubble .who-line{font-size:13px;font-weight:600;color:var(--accent);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bubble .meta{font-size:11px;color:var(--muted);text-align:right;margin-top:2px;font-variant-numeric:tabular-nums}
.quote{border-left:3px solid var(--accent);padding:2px 8px;margin:4px 0;font-size:13px;color:var(--muted);background:rgba(0,0,0,.12);border-radius:0 6px 6px 0}
.msg-actions{display:flex;gap:2px;opacity:.75}
.msg-actions button{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:6px}
.msg-actions button:hover{color:var(--ink);background:var(--surface-2)}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.composer .row{flex-wrap:nowrap}
.composer textarea{min-height:42px;height:42px;resize:none}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.person{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.person:hover{border-color:var(--accent)}
.exp{border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:2px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:620px){.levels{grid-template-columns:1fr}}
.level{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px}
.level b{display:block;margin-bottom:2px}

/* analytics */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.delta{font-size:12px;font-weight:600;font-family:var(--mono)}
.delta.up{color:var(--yes)} .delta.down{color:var(--no)}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:5px}
.hbar .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
svg text{fill:var(--muted);font-family:var(--body)}

/* initiatives */
.reg{font-family:var(--mono);font-size:12px;color:var(--muted)}
.init h3{font-size:18px;margin:6px 0}
.articles{background:var(--surface-2);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:14px;max-width:72ch}
.bar{height:12px;border-radius:6px;background:var(--surface-2);display:flex;overflow:hidden}
.bar .y{background:var(--yes)} .bar .n{background:var(--no)} .bar .a{background:var(--abst)}
.tally-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

.notice{border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);font-size:14px}
.notice.warn{background:var(--admin-soft)}
.empty{text-align:center;padding:32px 18px;color:var(--muted)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.gate{max-width:700px;margin:0 auto}
.gate h2{font-size:26px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface-2);border-radius:8px;padding:12px;font-size:13px}
.step b{display:block;font-family:var(--display);font-size:13px;margin-bottom:4px}
.code{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre;overflow-x:auto;max-height:340px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

.no-tags .tags-only{display:none!important}
.profile-page{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:0}
.profile-page>.btn.ghost{align-self:flex-start;margin-bottom:14px}
.pf-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;padding-bottom:20px}
.avatar.xl{width:76px;height:76px;border-radius:16px}
.pf-sec{border-top:1px solid var(--line);padding-block:18px}
.subtabs{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;color:var(--muted);padding:6px 0 8px;border-bottom:2px solid transparent;font-size:14px}
.subtabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.asks{display:flex;flex-direction:column}
.ask{display:flex;flex-direction:column;gap:6px;padding-block:14px;border-bottom:1px solid var(--line)}
.ask:last-child{border-bottom:0}
.ask-text{font-size:16px;white-space:pre-wrap;word-wrap:break-word;max-width:72ch}
.chip.ask-st{border-radius:999px}
.chip.st-active{color:var(--accent);border-color:var(--accent-soft);background:transparent}
.chip.st-inwork{color:var(--ink);border-color:var(--accent-soft);background:var(--accent-soft)}
.chip.st-done{color:var(--yes);border-color:var(--yes-soft);background:transparent}
.chip.st-stale{color:var(--muted)}
.exp-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;padding-block:12px;border-top:1px solid var(--line)}
.exp-row:first-of-type{border-top:0}
@media (max-width:560px){.exp-row{grid-template-columns:1fr;gap:2px}}
/* ===== Фирменный слой РВИ ===== */
:root{--r:4px}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;background-attachment:fixed}
h1,h2{font-weight:300;text-transform:uppercase;letter-spacing:.01em}
h3{font-weight:500}
.top{background:var(--bg);border-bottom:2px solid var(--accent)}
body::before{background:var(--bg)}
.mark{width:auto;height:auto;border:0;border-radius:0;background:none;color:var(--accent);font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:.04em;white-space:nowrap}
.brand h1{font-size:20px;font-weight:300}
.brand small{font-family:var(--mono);font-size:11px;letter-spacing:.02em}
.sec-title{display:flex;align-items:center;gap:14px;font-size:26px}
.sec-title::before{content:"✱";color:var(--accent);font-size:20px;font-weight:700;flex:none}
.sec-title::after{content:"";height:2px;width:56px;background:var(--accent);flex:none;order:-1;display:none}
.gate h2{font-size:30px}
.eyebrow{color:var(--accent);font-family:var(--mono);letter-spacing:.06em}
.eyebrow::before{content:"// "}
.search input{border-radius:var(--r);background:var(--surface)}
.btn,.kind,input[type=text],input[type=number],textarea,select{border-radius:var(--r)}
.btn.primary{text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.chip,.count{border-radius:2px}
.search input[type=text]{padding-left:40px}
.dm-ctx{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;border-left:3px solid var(--accent);background:rgba(0,0,0,.18);border-radius:4px;padding:6px 10px;margin-bottom:6px;color:var(--ink);font-size:13px}
.dm-list .ch{padding:8px}
.contacts{display:flex;flex-direction:column;max-width:720px}
.contact{display:flex;align-items:center;gap:12px;padding-block:9px;border-bottom:1px solid var(--line)}
.contact:last-child{border-bottom:0}
.contact>.small.muted:first-child{width:130px;flex:none}
.contact>a,.contact>.contact-val{flex:1 1 auto;min-width:0;font-size:15px}
.contact .chip{flex:none;order:3}
.contact>.btn{order:4;flex:none}
.contact a,.contact-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.contact .btn.ghost{padding:2px 6px;font-size:12px}
.dm-list .ch .count{flex:none}
/* Левая панель разделов */
:root{--side-w:68px}
body.side-wide{--side-w:236px}
body.has-side{padding-left:var(--side-w)}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:8;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));transition:width .15s}
.side-logo{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:16px;margin:0 0 14px 2px;flex:none}
.side-list{display:flex;flex-direction:column;gap:4px}
.side-bottom{margin-top:auto}
.side .tab{position:relative;border:0;border-radius:10px;background:none;color:var(--muted);height:44px;padding:0 12px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden}
.side .tab svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .tab:hover{color:var(--ink);background:var(--surface)}
.side .tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.side .tab[aria-selected="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.side .tab-label{overflow:hidden;text-overflow:ellipsis}
.side .count{position:absolute;top:5px;left:28px;font-size:10px;padding:0 5px;line-height:15px;background:var(--accent);color:var(--accent-ink)}
.side .tab.hot .count{background:var(--admin);color:var(--accent-ink)}
body:not(.side-wide) .side .tab-label{display:none}
body.side-wide .side .count{position:static;margin-left:auto}
.side-toggle{margin-top:8px;width:44px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;flex:none}
.side-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(180deg);transition:transform .15s}
body.side-wide .side-toggle svg{transform:none}
.side-toggle:hover{color:var(--ink)}
/* Телефон: панель становится нижней строкой с иконками */
@media (max-width:760px){
  body.has-side{padding-left:0;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}

/* ---------- импорт опыта из LinkedIn и ArtStation ---------- */
function parseExperience(text){
  const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const dateRe=/((?:[A-Za-zА-Яа-яЁё.]+\s+)?(\d{4}))\s*[-–—]\s*((?:[A-Za-zА-Яа-яЁё.]+\s+)?(\d{4})|present|now|current|настоящее время|по настоящее время|наст\.?\s*время|н\.?\s?в\.?|сейчас)/i;
  const durRe=/^(·\s*)?\d+\s*(yrs?|years?|mos?|months?|лет|года?|г\.|мес)/i;
  const hits=[]; lines.forEach((l,i)=>{ const m=l.match(dateRe); if(m) hits.push({i,m}); });
  return hits.map((hit,k)=>{
    const {i,m}=hit; const prefix=lines[i].slice(0,m.index).replace(/[,·|]\s*$/,"").trim();
    let role, company;
    if(prefix){ const at=prefix.match(/^(.+?)\s+(?:at|в|@|—|-|,)\s+(.+)$/i); role=at?at[1]:prefix; company=at?at[2]:(lines[i-1]||""); }
    else { role=lines[i-2]||lines[i-1]||""; company=(lines[i-2]?lines[i-1]:"")||""; const at=role.match(/^(.+?)\s+(?:at|в|@)\s+(.+)$/i); if(at&&!company){role=at[1];company=at[2];} }
    company=company.split(" · ")[0].trim();
    const stop=k+1<hits.length?hits[k+1].i-(lines[hits[k+1].i].slice(0,hits[k+1].m.index).trim()?0:2):lines.length;
    const placeRe=/^[^.!?]{2,40},\s*[^.!?]{2,40}$/; // «Moscow, Russia» — строка с местом, не описание
    const description=lines.slice(i+1,Math.max(i+1,stop)).filter(l=>!durRe.test(l)&&!placeRe.test(l)).join(" ").slice(0,600);
    return {role:role.trim(),company,from:+m[2]||null,to:m[4]?+m[4]:null,description};
  }).filter(e=>e.role||e.company);
}

/* ================= boot ================= */
let qTimer;
document.getElementById("q").addEventListener("input",e=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ S.q=e.target.value; S.qType="all"; render(); },200); });
async function boot(){ document.body.classList.toggle("no-tags",!TAGS_ON);
  try{ const t=localStorage.getItem("rvi-tab"); if(t) S.tab=t; }catch(e){}
  if(!window.claude?.use){ S.offline=true; render(); return; }
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  S.db=db; S.user=user; if(!db){ S.offline=true; render(); return; }
  const me=user?await user.me():null; S.uid=me?.id||null; S.isAdmin=!!me?.canEdit;
  const cw=user?await user.can("data.write"):null; S.canWrite=cw!==false;
  const need=["channels","messages","blogs","comments","inits","ballots","apps","staff","profiles","requests","projects","dms"];
  const timer=setTimeout(()=>{S.stale=true;render();},10000);
  let pending=false; const schedule=()=>{ if(pending) return; pending=true; setTimeout(()=>{pending=false;render();},16); };
  const done=(k,snap)=>{ if(!snap.metadata.fromCache) S.loaded[k]=true; if(need.every(n=>S.loaded[n])){ clearTimeout(timer); S.stale=false; if(!S.ready){ S.ready=true; registerStaff(); } } schedule(); };
  const fail=k=>e=>{ if(e.code!=="revoked") toast("Часть данных не загрузилась."); done(k,{metadata:{fromCache:false}}); };
  const list=s=>s.docs.map(d=>({...d.data(),id:d.id})); const map=s=>Object.fromEntries(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));
  db.collection("channels").onSnapshot(s=>{S.channels=list(s);done("channels",s);},fail("channels"));
  db.collection("messages").orderBy("createdAt","desc").limit(1000).onSnapshot(s=>{S.messages=list(s);done("messages",s);},fail("messages"));
  db.collection("blogs").orderBy("createdAt","desc").limit(300).onSnapshot(s=>{S.blogs=list(s);done("blogs",s);},fail("blogs"));
  db.collection("comments").orderBy("createdAt","asc").limit(1000).onSnapshot(s=>{S.comments=list(s);done("comments",s);},fail("comments"));
  db.collection("initiatives").onSnapshot(s=>{S.inits=list(s);done("inits",s);},fail("inits"));
  db.collection("ballots").onSnapshot(s=>{S.ballots=map(s);done("ballots",s);},fail("ballots"));
  db.collection("applications").onSnapshot(s=>{S.apps=map(s);done("apps",s);},fail("apps"));
  db.collection("staff").onSnapshot(s=>{S.staff=map(s);done("staff",s);},fail("staff"));
  db.collection("profiles").onSnapshot(s=>{S.profiles=map(s);done("profiles",s);},fail("profiles"));
  db.collection("requests").orderBy("createdAt","desc").limit(300).onSnapshot(s=>{S.requests=list(s);done("requests",s);},fail("requests"));
  db.collection("projects").orderBy("createdAt","desc").limit(500).onSnapshot(s=>{S.projects=list(s);done("projects",s);},fail("projects"));
